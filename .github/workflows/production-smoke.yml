name: Production Smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    name: Production E2E smoke
    runs-on: ubuntu-latest
    env:
      HAS_PRODUCTION_URL: ${{ secrets.E2E_PRODUCTION_URL != '' }}
    steps:
      - name: Skip smoke test
        if: env.HAS_PRODUCTION_URL != 'true'
        run: echo "Production smoke skipped because E2E_PRODUCTION_URL is missing."

      - name: Checkout
        if: env.HAS_PRODUCTION_URL == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: env.HAS_PRODUCTION_URL == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: env.HAS_PRODUCTION_URL == 'true'
        run: npm ci

      - name: Install Playwright browser
        if: env.HAS_PRODUCTION_URL == 'true'
        run: npx playwright install --with-deps chromium
        working-directory: client

      - name: Run production smoke
        if: env.HAS_PRODUCTION_URL == 'true'
        run: npm run test:e2e:production -w client
        env:
          E2E_PRODUCTION_URL: ${{ secrets.E2E_PRODUCTION_URL }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_CONTACT_EMAIL: ${{ secrets.E2E_CONTACT_EMAIL }}
